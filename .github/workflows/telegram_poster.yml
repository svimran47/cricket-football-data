name: Auto Post Football & Cricket to Telegram

on:
  schedule:
    # Runs automatically once every 24 hours at 8:00 PM Malaysia time (12:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      force_repost:
        description: 'Force re-post all current matches (ignore history)'
        required: false
        type: boolean
        default: false
      match_slug:
        description: 'Target match slug, video ID or link (leave blank for all)'
        required: false
        type: string
        default: ''

jobs:
  post-matches:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests tzdata

      - name: Run Verification Tests
        run: python test_poster.py

      - name: Run Telegram Match Poster
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          FORCE_REPOST: ${{ inputs.force_repost }}
          TARGET_MATCH: ${{ inputs.match_slug }}
        run: python telegram_poster.py

      - name: Commit and Push Updated History
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f posted_matches.json ]; then
            git add posted_matches.json
            git diff --staged --quiet || (git commit -m "chore: update posted matches history [skip ci]" && git pull --rebase origin main && git push origin main)
          fi
